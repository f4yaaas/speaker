<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speaker Diagnostic</title>
<style>
:root{--bg:#020617;--card:rgba(15,23,42,.85);--accent:#60a5fa;--accent2:#34d399;--text:#e5e7eb}
.splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#0f172a,#020617 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;transition:opacity .6s ease,visibility .6s}
.splash.hide{opacity:0;visibility:hidden}
.splashLogo{font-size:26px;font-weight:700;letter-spacing:.6px}
.splashSub{margin-top:8px;font-size:13px;opacity:.7}
.loader{margin-top:18px;width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top:3px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial;background:radial-gradient(circle at 30% 20%,#0f172a,#020617 70%);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{width:380px}
.title{font-size:22px;font-weight:600;margin-bottom:14px;letter-spacing:.4px}
.card{backdrop-filter:blur(16px);background:var(--card);border-radius:24px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.08)}
.status{margin-top:8px;font-size:13px;opacity:.85}
.tasks{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.task{padding:16px;border-radius:18px;background:linear-gradient(180deg,#0b1220,#0a0f1a);border:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.task.active{border-color:var(--accent)}
.task.disabled{opacity:.4;pointer-events:none}
button{border:none;border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer}
.start{background:var(--accent);color:#001018}
.stop{background:#ef4444;color:#fff}
.secondary{background:#1e293b;color:#cbd5f5}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#020617;border:1px solid rgba(255,255,255,.08)}
.slider{width:100%;margin-top:8px}
.donate{margin-top:18px;text-align:center}
.upiBox{margin-top:10px;padding:12px;border-radius:12px;background:#020617;border:1px dashed rgba(255,255,255,.15);font-size:13px}
.adBanner{position:fixed;left:0;right:0;bottom:-120px;margin:auto;width:360px;background:#0f172a;border-radius:16px;overflow:hidden;transition:bottom .5s}
.adBanner.show{bottom:18px}
.adClose{position:absolute;top:6px;right:10px;background:transparent;border:none;color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="splashLogo">Speaker Diagnostic</div>
  <div class="splashSub">Initializing audio engine</div>
  <div class="loader"></div>
</div>
<div class="wrap">
  <div class="title">Speaker Diagnostic</div>
  <div class="card">
    <div class="status" id="status">Ready — select a test | <span id="timer">00:00</span></div>

    <div class="tasks">
      <div class="task" id="musicTask"><div><b>Music Speaker Test</b><br><span class="badge">Stereo Check</span></div><button id="musicBtn" class="start">Start</button></div>
      <div class="task" id="vibrationTask"><div><b>Vibration Sync Test</b><br><span class="badge">Hardware Check</span></div><button id="vibeBtn" class="start">Start</button></div>
      <div class="task" id="dolbyTask"><div><b>Dolby Channel Test</b><br><span class="badge">Left / Right</span></div><button id="dolbyBtn" class="start">Start</button></div>
      <div class="task" id="toneTask"><div><b>Frequency Sweep</b><br><span class="badge">200Hz → 2000kHz</span></div><button id="toneBtn" class="start">Start</button></div>
      <div class="task" id="cleanTask"><div><b>Dust Cleaning Mode</b><br><span class="badge">Low Frequency Pulses</span></div><button id="cleanBtn" class="start">Start</button></div>
    </div>

    <div style="font-size:13px;margin-top:14px">Balance Control</div>
    <input type="range" min="-1" max="1" step="0.1" value="0" id="balance" class="slider">

    <div class="donate">
      <button id="donateBtn" class="secondary">Support developer</button>
      
    </div>
  </div>
</div>

<div id="ad" class="adBanner">
  <img src="asset/banner.jpg" style="width:100%">
  <button class="adClose" id="adClose">x</button>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
const splash=document.getElementById('splash');
setTimeout(()=>{splash.classList.add('hide');},1500);
const status=document.getElementById('status');
const timer=document.getElementById('timer');
const music=new Audio('asset/track.mp3'); music.loop=true;
let vibeTimer=null,dolbyAudio=null,ctx=null,osc=null,panNode=null,activeTask=null;
let sessionTime=0,timerInt=null;

function startTimer(){clearInterval(timerInt);sessionTime=0;timerInt=setInterval(()=>{sessionTime++;let m=String(Math.floor(sessionTime/60)).padStart(2,'0');let s=String(sessionTime%60).padStart(2,'0');timer.textContent=m+':'+s;},1000);}
function stopTimer(){clearInterval(timerInt);timer.textContent='00:00';}

const tasks={
 music:{start(){music.play();startTimer();status.textContent='Music speaker test running';},stop(){music.pause();music.currentTime=0;stopTimer();}},
 vibration:{start(){if(navigator.vibrate)vibeTimer=setInterval(()=>navigator.vibrate(80),700);startTimer();status.textContent='Vibration sync running';},stop(){clearInterval(vibeTimer);navigator.vibrate?.(0);stopTimer();}},
 dolby:{start(){dolbyAudio=new Audio('asset/dolby.mp3');dolbyAudio.loop=true;dolbyAudio.play();startTimer();status.textContent='Dolby channel test running';},stop(){dolbyAudio?.pause();stopTimer();}},
 tone:{start(){ctx=new AudioContext();osc=ctx.createOscillator();panNode=ctx.createStereoPanner();osc.connect(panNode).connect(ctx.destination);osc.start();startTimer();let f=200;const i=setInterval(()=>{osc.frequency.value=f;f*=1.15;if(f>2000000)clearInterval(i);},120);status.textContent='Frequency sweep running';},stop(){osc?.stop();ctx?.close();stopTimer();}},
 clean:{start(){ctx=new AudioContext();osc=ctx.createOscillator();osc.connect(ctx.destination);osc.start();startTimer();let dir=true;setInterval(()=>{osc.frequency.value=dir?160:40;dir=!dir;},120);status.textContent='Cleaning pulses running';},stop(){osc?.stop();ctx?.close();stopTimer();}}
};

function bind(id,name){const btn=document.getElementById(id);btn.onclick=()=>{if(activeTask){tasks[activeTask].stop();if(activeTask===name){activeTask=null;btn.textContent='Start';return;}document.querySelectorAll('.task button').forEach(b=>b.textContent='Start');}
activeTask=name;tasks[name].start();btn.textContent='Stop';};}

bind('musicBtn','music');
bind('vibeBtn','vibration');
bind('dolbyBtn','dolby');
bind('toneBtn','tone');
bind('cleanBtn','clean');

document.getElementById('balance').oninput=e=>{if(panNode)panNode.pan.value=e.target.value};
document.getElementById('donateBtn').onclick=()=>{
  const url='upi://pay?pa=fayascreator@okhdfcbank&pn=Fayas&am=1&cu=INR';
  window.location.href=url;
};

setTimeout(()=>document.getElementById('ad').classList.add('show'),1200);
document.getElementById('adClose').onclick=()=>document.getElementById('ad').style.display='none';
});
</script>
</body>
</html>

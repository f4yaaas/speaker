<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speaker Diagnostic</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{background:#1e293b;padding:28px;border-radius:18px;width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h2{margin:0 0 10px 0;font-weight:600}
  .info{margin-top:8px;font-size:14px;opacity:.85}
  button{margin-top:14px;padding:11px 18px;border:none;border-radius:12px;background:#38bdf8;color:#001018;font-weight:bold;cursor:pointer;width:100%}
  button.secondary{background:#334155;color:#e5e7eb}
  .ad-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
  .ad{width:min(600px,95%);margin:12px;border-radius:16px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.45);transform:translateY(120%);animation:slideUp .9s ease forwards;animation-delay:2s;pointer-events:auto}
  .ad img{display:block;width:100%;height:auto}
  .ad-close{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:26px}
  @keyframes slideUp{to{transform:translateY(0)}}
</style>
</head>
<body>
<div class="card">
  <h2>Speaker Test Player</h2>
  <div class="info" id="status">Ready</div>
  <button id="vibe" class="secondary">Vibration: Off</button>
  <button id="toggle">Play</button>
  <button id="dolby" class="secondary">Dolby Test</button>
</div>

<div class="ad-wrap">
  <div class="ad">
    <button class="ad-close" id="adClose">×</button>
    <a href="https://glider-app.pages.dev" target="_blank">
    <img src="asset/banner.jpg" alt="Ad banner">
  </a>
  </div>

<script>
let playing=false,vibrationEnabled=false,vibeTimer=null;
const status=document.getElementById('status');
const btn=document.getElementById('toggle');
const vibeBtn=document.getElementById('vibe');
const music=new Audio('asset/track.mp3');
let dolbyAudio=null;
const dolbyBtn=document.getElementById('dolby');
const adClose=document.getElementById('adClose');
music.loop=true;

function startVibration(){
  if(!navigator.vibrate) return;
  vibeTimer=setInterval(()=>{ if(vibrationEnabled) navigator.vibrate(60); },700);
}

function stopVibration(){
  if(vibeTimer) clearInterval(vibeTimer);
  navigator.vibrate?.(0);
}

vibeBtn.onclick=()=>{
  vibrationEnabled=!vibrationEnabled;
  vibeBtn.textContent=vibrationEnabled?"Vibration: On":"Vibration: Off";
};

btn.onclick=async()=>{
  if(!playing){
    await music.play().catch(()=>{});
    startVibration();
    status.textContent='Playing track.mp3';
    btn.textContent='Stop';
    playing=true;
  }else{
    music.pause();
    music.currentTime=0;
    stopVibration();
    status.textContent='Stopped';
    btn.textContent='Play';
    playing=false;
  }
};

adClose.onclick=()=>{
  adClose.parentElement.style.display='none';
};

// Dolby channel test using mp3 file
function startDolby(){
  dolbyAudio=new Audio('asset/dolby.mp3');
  dolbyAudio.loop=true;
  dolbyAudio.play().catch(()=>{});
  status.textContent='Dolby test playing';
}
function stopDolby(){
  if(dolbyAudio){
    dolbyAudio.pause();
    dolbyAudio.currentTime=0;
  }
  status.textContent='Dolby test stopped';
}
let dolbyOn=false;
dolbyBtn.onclick=()=>{
  if(!dolbyOn){
    music.pause();
    startDolby();
    dolbyBtn.textContent='Stop Dolby Test';
    dolbyOn=true;
  }else{
    stopDolby();
    dolbyBtn.textContent='Dolby Test';
    dolbyOn=false;
  }
};
</script>
</body>
</html>
